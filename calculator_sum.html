<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <link rel="stylesheet" href="./stylesheet.css">
    <script src="./index.js" defer></script>
    <title>Function library example</title>
  </head>
<body>
  <h1>Sum calculator</h1>
  <!-- Create input fields for number input -->
  <form action="" >
  <!-- Create input field to receive 1st value -->
  <label for="firstNumInput"></label>
  <input type="number" id="firstNumInput" name="firstNumInput">
  <!-- Create add sign -->
  <span>+</span>
  <!-- Create input field to receive 2nd value -->
  <label for="firstNumInput"></label>
  <input type="number" id="secondNumInput" name="secondNumInput">
  <!-- Create button input with addButton onClick listener -->
  <label for="addButton"></label>
  <input type="button" value="=" id="addButton" name="addButton" onclick="addNum()">
  </form>
</body>
</html>
