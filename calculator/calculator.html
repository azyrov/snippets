<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./calculator.js" defer></script>
    <link rel="stylesheet" href="./stylesheet.css">
    <title>Calculator</title>
</head>
<body>
    <div class="container">
        <!-- <div class="button-group">
            <button>1</button>

        <div class="grandparent">
            <input type="text" placeholder="" id="textField">
            <div class="parent">
                <button id="oneBtn" value=1>1</button>
                <button id="twoBtn" value="2">2</button>
                <button id="threeBtn">3</button>
                <button id="fourBtn">4</button>
                <button id="fiveBtn">5</button>
                <button id="sixBtn">6</button>
                <button id="seveBtn">7</button>
                <button id="eightBtn">8</button>
                <button id="nineBtn">9</button>
                <button id="zeroBtn">0</button>
                <button id="addBtn">+</button>
                <button id="subtractBtn">-</button>
                <button id="dividerBtn">/</button>
                <button id="multiplyBtn">*</button> 
                <button id="equalBtn">=</button> 
                <button id="clearBtn">CLR</button> 
            </div>        
        </div>
    </div>
</body>
</html>
