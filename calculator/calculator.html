<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./calculator.js" defer></script>
    <link rel="stylesheet" href="./stylesheet.css">
    <title>Calculator</title>
</head>
<body>
    <div class="container">
        <!-- <div class="button-group">
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>+</button>
            <button>-</button>
            <button>/</button>
            <button>*</button>     
        </div> -->
        <div class="grandparent">
            <input type="text" placeholder="0" id="textField">
            <div class="parent">
                <button id="oneBtn" value=1>1</button>
                <button id="twoBtn" value="2">2</button>
                <button id="threeBtn" value="3">3</button>
                <button id="fourBtn" value="4">4</button>
                <button id="fiveBtn" value="5">5</button>
                <button id="sixBtn" value="6">6</button>
                <button id="seveBtn" value="7">7</button>
                <button id="eightBtn" value="8">8</button>
                <button id="nineBtn" value="9">9</button>
                <button id="zeroBtn" value="0">0</button>
                <button id="addBtn" value="+">+</button>
                <button id="subtractBtn" value="-">-</button>
                <button id="dividerBtn">/</button>
                <button id="multiplyBtn" value="*">*</button> 
                <button id="equalBtn">=</button> 
                <button id="clearBtn">CLR</button> 
            </div>        
        </div>
    </div>
</body>
</html>
