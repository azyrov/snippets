<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./calculator.js" defer></script>
    <link rel="stylesheet" href="./stylesheet.css">
    <title>Calculator</title>
</head>
<body>
    <div class="container">
        <!-- <div class="button-group">
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>+</button>
            <button>-</button>
            <button>/</button>
            <button>*</button>     
        </div> -->
        <div class="grandparent">
            <input type="text" placeholder="0" id="textField">
            <div class="parent">
                <button id="oneBtn" data-value=1>1</button>
                <button id="twoBtn" data-value="2">2</button>
                <button id="threeBtn" data-value="3">3</button>
                <button id="fourBtn" data-value="4">4</button>
                <button id="fiveBtn" data-value="5">5</button>
                <button id="sixBtn" data-value="6">6</button>
                <button id="seveBtn" data-value="7">7</button>
                <button id="eightBtn" data-value="8">8</button>
                <button id="nineBtn" data-value="9">9</button>
                <button id="zeroBtn" data-value="0">0</button>
                <button id="addBtn" data-value="+">+</button>
                <button id="subtractBtn" data-value="-">-</button>
                <button id="divideBtn" data-value="/">/</button>
                <button id="multiplyBtn" data-value="*">*</button> 
                <button id="equalBtn" data-value="=">=</button> 
                <button id="clearBtn" data-value="@">CLR</button> 
            </div>        
        </div>
    </div>
</body>
</html>
