<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./stylesheet.css">
    <title>Centering buttons</title>
</head>
<body>
    <div class="grandparent">
        <div class="parent">
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button>4</button>
                <button>5</button>
        </div>
    </div>
    <div class="father">
        <div class="child">
            <p>my name is John</p>
        </div>
    </div>
</body>
</html>
