<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="stylesheet.css">
        <script src="./index.js" defer></script>
    </head>
    <body>
        <div id="outer" style="padding: 30px; background: #e0f2fe;">
            Outer Div (Grandparent)
            <div id="middle" style="padding: 30px; background: #bae6fd;">
                Middle Div (Parent)
                <button id="inner" style="padding: 10px 20px;">Click Me (Target)</button>
            </div>
            <button id="btnNew">Click me with ANY mouse button!</button>
            <p id="message"></p>
            <button id="btnKeys">Click me with Alt, Shift or Ctrl pressed</button>
        </div>
        <div>
            <p>Move your mouse to see your location</p>
            <div id="track"></div>
            <p id="log"></p>
        </div>
    </body>
</html>
